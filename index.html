<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1d3d">
<title>Gửi em một bức thư 💌</title>
<meta name="description" content="Một bức thư nhỏ nhân ngày sinh nhật.">
<meta property="og:title" content="Gửi em một bức thư 💌">
<meta property="og:description" content="Có một điều bất ngờ đang chờ em mở ra…">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23d62839' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Kaushan+Script&family=Mali:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="moon" aria-hidden="true"></div>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="balloons" aria-hidden="true"></div>

<main class="stage" id="stage">
  <!-- Màn 1: phong thư -->
  <section class="intro" id="intro">
    <p class="intro-top">Có một điều bất ngờ dành cho em…</p>

    <div class="env" id="env" role="button" tabindex="0" aria-label="Chạm để mở thư">
      <div class="env-back"></div>
      <div class="env-letter" id="envLetter"><span>♥</span></div>
      <div class="env-front">
        <i class="pk pk-l"></i><i class="pk pk-r"></i><i class="pk pk-b"></i>
        <span class="env-to" id="envTo"></span>
        <span class="env-stamp" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="#d62839" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </span>
      </div>
      <div class="env-flap"></div>
      <div class="seal" id="seal" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <defs>
            <radialGradient id="sg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ff6b7d"/><stop offset=".6" stop-color="#d62839"/><stop offset="1" stop-color="#9c1424"/></radialGradient>
          </defs>
          <circle cx="32" cy="32" r="29" fill="url(#sg)"/>
          <circle cx="32" cy="32" r="23" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.6" stroke-dasharray="2 3"/>
          <path fill="#fff4ea" d="M32 46l-1.9-1.7C23.7 38.5 20 35.1 20 30.9 20 27.5 22.6 25 25.8 25c1.8 0 3.6.8 4.7 2.2h3C34.6 25.8 36.4 25 38.2 25c3.2 0 5.8 2.5 5.8 5.9 0 4.2-3.7 7.6-10.1 13.4L32 46z" transform="translate(0 -2)"/>
        </svg>
      </div>
    </div>

    <p class="tap-hint" id="tapHint"><span>Chạm vào phong thư để mở</span> <b>♥</b></p>
  </section>

  <!-- Màn 2: bức thư -->
  <section class="paper" id="paper" hidden>
    <i class="tape tape-a"></i><i class="tape tape-b"></i>
    <svg class="postmark" viewBox="0 0 120 120" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="2.4">
        <circle cx="60" cy="60" r="46"/><circle cx="60" cy="60" r="39" stroke-width="1.2"/>
      </g>
      <text x="60" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" font-family="Mali, sans-serif" id="pmDate">24.11.2026</text>
      <path d="M38 72h44" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <text x="60" y="88" text-anchor="middle" font-size="11" fill="currentColor" font-family="Mali, sans-serif">with love</text>
      <path d="M8 30q14-10 28 0t28 0t28 0t28 0" fill="none" stroke="currentColor" stroke-width="2" opacity=".55" transform="translate(40 -20)"/>
    </svg>

    <div class="pages" id="pages"></div>

    <nav class="controls" id="controls">
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button class="next" id="next" type="button">Tiếp <span>›</span></button>
    </nav>
  </section>

  <!-- Màn cuối -->
  <section class="finale" id="finale" hidden>
    <h2 class="f-big" id="fBig"></h2>
    <p class="f-line" id="fLine"></p>
    <p class="f-days" id="fDays" hidden></p>
    <p class="f-sign" id="fSign"></p>
    <button class="again" id="again" type="button">↺ Đọc lại thư</button>
  </section>
</main>


<canvas id="fx" aria-hidden="true"></canvas>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
